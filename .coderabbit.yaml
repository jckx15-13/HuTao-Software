# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
early_access: false
reviews:
  profile: assertive
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  path_instructions:
    - path: "bridge/**"
      instructions: |
        You are reviewing a Python FastAPI bridge routing AI assistant requests.
        Strict QA checks:
        - Token efficiency: flag wasteful prompt wrapping or serialization.
        - Local-first priority: ensure local LLM runtimes (Ollama/LM Studio) are checked first.
        - Security & Sentry Telemetry: verify Sentry exception reporting on failure routes, no leaked keys, strict Pydantic validation.
        - Async & Resource Safety: correct HTTP client reuse, non-blocking loops, clean error status codes.
    - path: "src/core/qa/**"
      instructions: |
        QA and Telemetry subsystem review:
        - Sentry QA integration correctness, breadcrumb tracking, no swallowed exceptions.
        - Zero runtime crashes when SENTRY_DSN is absent (mock mode safety).
    - path: "src/core/state/**"
      instructions: |
        Zustand state slices review:
        - Strict slice isolation: slices must not directly mutate external slice states without actions.
        - Immutable updates only; prohibit direct state mutations.
        - Validate initial state reset functions and selector performance.
    - path: "src/components/**"
      instructions: |
        React UI components review:
        - Strict wrapping with ErrorBoundary and sentryQA instrumentation on async handlers.
        - Tactical geo-tech design compliance matching design-tokens.tailwind.json.
        - Component modularity: flag components >300 lines and request subcomponent extraction.
        - Accessibility (a11y) & responsive layout integrity across all device breakpoints.
    - path: "src/plugins/**"
      instructions: |
        Data plugins review:
        - Imperative and manifest plugin registration compliance.
        - Clean resource disposal on unmount (`dispose()` method).
        - Robust network timeout and fallback guards for live telemetry APIs.
    - path: "src/lib/**"
      instructions: |
        Physics, astronomy, and utility libraries review:
        - Mathematical rigor: verified bounds for orbital elements, coordinate transforms, and astronomical models.
        - Edge-case validation: handling of NaNs, zero division, infinity, and invalid geographic coordinates.
    - path: "scripts/**"
      instructions: |
        Test runner and verification harness review:
        - Strict assertion coverage; reject superficial passing tests without assertions.
        - Complete pass criteria: type checking, state immutability, contract adherence, layout bounds, and Sentry integration checks.
chat:
  auto_reply: true
