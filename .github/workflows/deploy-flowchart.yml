name: Check Flowchart Editor

on:
  push:
    branches: [main, "prototype/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: flowchart-editor/package-lock.json
      - run: npm ci --prefix flowchart-editor
      - run: npm audit --prefix flowchart-editor
      - run: npm run build --prefix flowchart-editor
