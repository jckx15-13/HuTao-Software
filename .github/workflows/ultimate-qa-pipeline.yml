name: Ultimate QA Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ─── Security & Dependency Scanning (Snyk) ───────────────────────────
  snyk-frontend:
    name: Snyk – Frontend
    runs-on: ubuntu-latest
    if: secrets.SNYK_TOKEN != ''
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --file=package.json --severity-threshold=high

  snyk-backend:
    name: Snyk – Python Bridge
    runs-on: ubuntu-latest
    if: secrets.SNYK_TOKEN != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r bridge/requirements.txt
      - uses: snyk/actions/python@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --file=bridge/requirements.txt --severity-threshold=high

  # ─── Visual Regression & Design Review (Chromatic) ───────────────────
  chromatic:
    name: Chromatic – Visual Regression
    runs-on: ubuntu-latest
    if: secrets.CHROMATIC_PROJECT_TOKEN != ''
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          buildScriptName: build-storybook
          exitZeroOnChanges: false
          exitOnceUploaded: true
          onlyChanged: true
          # Enforce design tokens — any visual diff triggers review
          autoAcceptChanges: false

  # ─── Runtime Telemetry – Sentry Source Maps ──────────────────────────
  sentry-sourcemaps:
    name: Sentry – Upload Source Maps
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      secrets.SENTRY_AUTH_TOKEN != '' &&
      secrets.SENTRY_ORG != '' &&
      secrets.SENTRY_PROJECT != ''
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:sourcemaps
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
